        .nav-btn:hover {

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            min-width: 280px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-btn {
            display: inline-block;
            padding: 12px 20px;
            font-size: 14px;
            color: #fff;
            text-decoration: none;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;

            transition: all 0.25s ease;
            cursor: pointer;
        }

        .modal-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .close-modal {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 28px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
        }

        .close-modal:hover {

        }

        @media (max-width: 480px) {

            }

                min-width: 260px;
                padding: 20px;
                max-width: 95vw;
            }

            .modal-grid {
                grid-template-columns: 1fr;
            }
        }

    <script>
        // ========== 禁止调试/查看源码（仅保留快捷键与右键屏蔽）==========
        // 说明：已移除原先每 500ms 执行 debugger 的定时器与「检测到 DevTools 就清空页面」逻辑。
        // 前者持续占用主线程、打开调试器会造成反复断点卡顿；后者会误伤正常访客并破坏页面。
        (function() {
            document.addEventListener('keydown', function(e) {
                var k = (e.key || '').toLowerCase();
                // F12
                if (e.key === 'F12') { e.preventDefault(); return false; }
                // Ctrl+Shift+I / J / C
                if (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1) {
                    e.preventDefault(); return false;
                }
                // Ctrl+U 查看源码、Ctrl+S 保存
                if (e.ctrlKey && ['u', 's'].indexOf(k) !== -1) {
                    e.preventDefault(); return false;
                }
            });

            // 禁止右键菜单
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
        })();

        // 根据状态显示对应内容
        function applyStatus() {
            var normal = document.getElementById('status-normal');
            var maintenance = document.getElementById('status-maintenance');
            var about = document.getElementById('status-about');

            if (normal) normal.style.display = 'none';
            if (maintenance) maintenance.style.display = 'none';
            if (about) about.style.display = 'none';

            if (SITE_STATUS === 2) {
                if (maintenance) maintenance.style.display = 'flex';
            } else if (SITE_STATUS === 3) {
                if (about) about.style.display = 'flex';
            } else {
                if (normal) normal.style.display = 'flex';
            }
        }
        applyStatus();

        function showModal(id) {
            document.getElementById(id).style.display = 'block';
        }

        // ESC 一键关闭所有弹窗
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal').forEach(function (m) {
                    m.style.display = 'none';
                });
            }
        });

        // 弹窗无障碍语义：role / aria-modal / 关联标题
        document.querySelectorAll('.modal').forEach(function (m) {
            m.setAttribute('role', 'dialog');
            m.setAttribute('aria-modal', 'true');
            var t = m.querySelector('.modal-title');
            if (t) {
                t.id = t.id || (m.id + '-title');
                m.setAttribute('aria-labelledby', t.id);
            }
        });

        // 关闭按钮支持键盘（Enter / 空格）
        document.querySelectorAll('.close-modal').forEach(function (btn) {
            btn.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    closeModal(btn.closest('.modal').id);
                }
            });
        });

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // 点击弹窗外部关闭
        document.querySelectorAll('.modal').forEach(function(modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });

        // 复制文本
        function copyText(text) {
            navigator.clipboard.writeText(text).then(function() {
                alert('已复制: ' + text);
            }).catch(function() {
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('已复制: ' + text);
            });
        }

    </script>

    <script>
        // 网站运行时长计时
        function showRuntime() {
            const startTime = new Date(2020, 11, 1);
            const now = new Date();
            const diff = now - startTime;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('runtime').textContent = '网站已运行 ' + days + ' 天 ' + hours + ' 小时 ' + minutes + ' 分钟 ' + seconds + ' 秒';
        }
        
        showRuntime();
        setInterval(showRuntime, 1000);
    </script>
