<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到我的博客</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
        .wrap { max-width: 720px; margin: 0 auto; padding: 40px 22px 60px; }
        h1 { font-size: 26px; margin-bottom: 10px; line-height: 1.4; }
        .meta { color: #888; font-size: 13px; margin-bottom: 26px; }
        p { line-height: 1.9; color: rgba(255,255,255,0.88); margin-bottom: 16px; font-size: 15px; }
        h2 { font-size: 19px; margin: 24px 0 10px; }
        .divider { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 24px 0; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>欢迎来到我的博客</h1>
        <p class="meta">2026-09-05</p>
        <p>你好，欢迎访问「反反的小世界」！从今天开始，我会在这里记录一些关于编程学习、技术难点和解决方案的内容。</p>
        <hr class="divider">
        <h2>这里会有什么？</h2>
        <p>本博客主要记录编程方面的资料，包括技术难点和解决方案，比如易语言方面的内容，方便后期自己查看和回顾。</p>
        <hr class="divider">
        <h2>如何在这里发布文章？</h2>
        <p>文章都存放在网站的 blog/ 文件夹中，每篇文章是一个独立的 HTML 文件。如果你也想发布文章，可以参考本博客中的《发布文章指南》。</p>
    </div>
</body>
</html>
